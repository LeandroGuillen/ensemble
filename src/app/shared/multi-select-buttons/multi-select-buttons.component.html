<div class="multi-select-buttons" [class.compact]="compact">
  @for (item of items; track item.id) {
    <button
      type="button"
      class="select-button"
      [class.active]="isItemSelected(item.id)"
      [style.background-color]="isItemSelected(item.id) ? item.color : null"
      [style.color]="isItemSelected(item.id) ? activeTextColor(item) : null"
      [style.border-color]="isItemSelected(item.id) ? item.color : null"
      [attr.aria-pressed]="isItemSelected(item.id)"
      (click)="onItemToggle(item.id)"
      >
      <span class="select-swatch" [style.background-color]="item.color" aria-hidden="true"></span>
      {{ item.name }}
    </button>
  }
</div>
