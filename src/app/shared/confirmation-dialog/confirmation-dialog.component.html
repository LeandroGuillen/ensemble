@if (visible) {
  <app-modal-frame
    [title]="title"
    [describedById]="messageId"
    (closed)="onClose()"
  >
    <p class="confirmation-message" [id]="messageId">{{ message }}</p>
    @if (checkbox) {
      <label><input type="checkbox" [checked]="checkbox.checked" (change)="setChecked($event)"> {{ checkbox.label }}</label>
    }
    <div class="modal-actions">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="onCancel()"
        autofocus
      >
        {{ cancelText }}
      </button>
      @if (secondaryText) {
        <button
          type="button"
          class="btn btn-secondary"
          (click)="onSecondary()"
        >
          {{ secondaryText }}
        </button>
      }
      <button
        type="button"
        [class]="'btn ' + (danger ? 'btn-danger' : confirmButtonClass)"
        (click)="onConfirm()"
      >
        {{ confirmText }}
      </button>
    </div>
  </app-modal-frame>
}
