@if (visible) {
  <app-modal-frame
    [title]="title"
    (closed)="onClose()"
  >
    <p class="confirmation-message">{{ message }}</p>
    <div class="modal-actions">
      <button
        type="button"
        class="btn btn-secondary"
        (click)="onCancel()"
        autofocus
      >
        {{ cancelText }}
      </button>
      <button
        type="button"
        [class]="'btn ' + (danger ? 'btn-danger' : confirmButtonClass)"
        (click)="onConfirm()"
      >
        {{ confirmText }}
      </button>
    </div>
  </app-modal-frame>
}
