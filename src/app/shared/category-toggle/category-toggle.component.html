<div class="category-toggle">
  <button
    type="button"
    class="toggle-option"
    [class.active]="selectedValue === ''"
    [class.error]="error"
    (click)="onOptionClick('', $event)"
    [title]="emptyLabel === 'All' ? 'Show all categories' : 'No category'"
    >
    {{ emptyLabel }}
  </button>
  @for (option of options; track option.id) {
    <button
      type="button"
      class="toggle-option"
      [class.active]="selectedValue === option.id"
      [class.error]="error"
      [style.--option-color]="option.color || null"
      (click)="onOptionClick(option.id, $event)"
      [title]="option.tooltip || option.name"
      >
      {{ option.name }}
    </button>
  }
</div>
