@if (visible) {
  <app-modal-frame title="Rename Pinboard" (closed)="onClose()">
    <form (ngSubmit)="onRename()">
      <div class="form-group">
        <label for="pinboardName">Pinboard Name:</label>
        <input
          type="text"
          id="pinboardName"
          class="form-control"
          [(ngModel)]="pinboardName"
          name="pinboardName"
          placeholder="Enter pinboard name..."
          autofocus
          required
          maxlength="50"
        />
      </div>
      @if (errorMessage) {
        <div class="error-message">
          {{ errorMessage }}
        </div>
      }
      <div class="modal-actions">
        <button type="button" class="btn btn-secondary" (click)="onClose()">Cancel</button>
        <button type="submit" class="btn btn-primary">Rename</button>
      </div>
    </form>
  </app-modal-frame>
}
