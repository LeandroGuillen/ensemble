<div class="modal-overlay" (click)="onBackdropClick()">
  <div
    #dialogPanel
    class="modal-dialog"
    [ngClass]="dialogClass"
    role="dialog"
    aria-modal="true"
    [attr.aria-labelledby]="resolvedTitleId"
    cdkTrapFocus
    [cdkTrapFocusAutoCapture]="true"
    (click)="onDialogClick($event)"
  >
    <div class="modal-header">
      <h3 [id]="resolvedTitleId">{{ title }}</h3>
      @if (showCloseButton) {
        <button
          type="button"
          class="close-btn"
          (click)="close()"
          aria-label="Close"
        >&times;</button>
      }
    </div>
    <div class="modal-body">
      <ng-content></ng-content>
    </div>
  </div>
</div>
