<div
  class="concept-card"
  [class.focused]="isFocused"
  [class.dimmed]="isDimmed"
  [class.selected]="isSelected"
  (dblclick)="onFocus()"
  tabindex="0"
>
  <div class="concept-header">
    <input
      type="text"
      class="concept-title"
      [value]="concept.title || ''"
      (blur)="onTitleChange($any($event.target).value)"
      (keyup.enter)="$any($event.target).blur()"
      placeholder="Untitled Concept"
    />
    <div class="concept-actions">
      <button
        class="icon-btn"
        (click)="onTakeTheStage($event)"
        title="Take the Stage - Create character from this concept"
        aria-label="Take the Stage - Create character from this concept"
      >
        <svg class="ui-icon" aria-hidden="true"><use href="assets/ui-icons.svg#star" /></svg>
      </button>
      <button
        class="text-action-danger"
        (click)="onDelete($event)"
        title="Delete concept"
        aria-label="Delete concept"
      >
        Delete
      </button>
    </div>
  </div>

  <textarea
    class="concept-notes"
    [value]="concept.notes"
    (blur)="onNotesChange($any($event.target).value)"
    placeholder="Jot down your ideas here..."
    rows="6"
  ></textarea>
</div>
