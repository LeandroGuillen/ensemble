<div class="page-actions">
  <div class="zoom-controls">
    <button class="toggle-option" (click)="zoomOut.emit()" [disabled]="!canZoomOut" title="Zoom out" aria-label="Zoom out">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
    <span class="zoom-level">{{ currentZoomLevel }}</span>
    <button
      class="toggle-option"
      (click)="zoomIn.emit()"
      [disabled]="!canZoomIn"
      title="Zoom in"
      aria-label="Zoom in"
      >
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <path d="M8 3V13M3 8H13" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
      </svg>
    </button>
  </div>

  <button class="icon-btn" (click)="resetView.emit()" title="Fit to view" aria-label="Fit to view">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M21 21L15 15M17 10C17 13.866 13.866 17 10 17C6.13401 17 3 13.866 3 10C3 6.13401 6.13401 3 10 3C13.866 3 17 6.13401 17 10Z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        />
      <circle cx="10" cy="10" r="3" stroke="currentColor" stroke-width="2" />
    </svg>
  </button>

  <button
    class="icon-toggle"
    [class.active]="showGrid"
    (click)="toggleGrid.emit()"
    [title]="showGrid ? 'Hide Grid' : 'Show Grid'"
    [attr.aria-label]="showGrid ? 'Hide Grid' : 'Show Grid'"
    >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path
        d="M3 9H21M3 15H21M9 3V21M15 3V21M3 3H21V21H3V3Z"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        stroke-linejoin="round"
        />
    </svg>
  </button>

  <button
    class="icon-toggle"
    [class.active]="snapToGrid"
    (click)="toggleSnapToGrid.emit()"
    [title]="snapToGrid ? 'Disable Snap to Grid' : 'Enable Snap to Grid'"
    [attr.aria-label]="snapToGrid ? 'Disable Snap to Grid' : 'Enable Snap to Grid'"
    >
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="6" cy="6" r="1.5" fill="currentColor" opacity="0.4" />
      <circle cx="12" cy="6" r="1.5" fill="currentColor" opacity="0.4" />
      <circle cx="18" cy="6" r="1.5" fill="currentColor" opacity="0.4" />
      <circle cx="6" cy="12" r="1.5" fill="currentColor" opacity="0.4" />
      <circle cx="12" cy="12" r="1.5" fill="currentColor" />
      <circle cx="18" cy="12" r="1.5" fill="currentColor" opacity="0.4" />
      <circle cx="6" cy="18" r="1.5" fill="currentColor" opacity="0.4" />
      <circle cx="12" cy="18" r="1.5" fill="currentColor" opacity="0.4" />
      <circle cx="18" cy="18" r="1.5" fill="currentColor" opacity="0.4" />
      <path
        d="M12 8V10M12 14V16M8 12H10M14 12H16"
        stroke="currentColor"
        stroke-width="2"
        stroke-linecap="round"
        />
      <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.5" fill="none" />
    </svg>
  </button>

  <button class="btn btn-primary pin-character-btn" (click)="pinCharacter.emit()" title="Pin Character (P)">
    <span class="plus-glyph" aria-hidden="true">+</span>
    Pin Character
    <kbd class="shortcut-hint">P</kbd>
  </button>
</div>
