<button
  type="button"
  [attr.aria-label]="'Open book ' + getAccessibleLabel()"
  class="book-container"
  [class.dragging]="isDragging"
  draggable="true"
  (click)="onBookClick()"
  (dragstart)="onDragStart($event)"
  (dragend)="onDragEnd()"
>
  <span class="book">
    <span class="book-cover" [style.background]="getBookGradient()">
      <span class="book-title">{{ getCoverTitle() }}</span>
      <span class="ornament"></span>
      @if (getCoverSubtitle()) {
        <span class="book-author">{{ getCoverSubtitle() }}</span>
      }
    </span>
    <span class="book-spine" [style.background]="getSpineGradient()">
      <span class="spine-text">{{ getSpineLabel().toUpperCase() }}</span>
    </span>

    <span class="book-back" [style.background]="getBackGradient()"></span>

    <span class="book-pages">
      <span class="page-layer"></span>
      <span class="page-layer"></span>
      <span class="page-layer"></span>
      <span class="page-layer"></span>
    </span>
  </span>
</button>
